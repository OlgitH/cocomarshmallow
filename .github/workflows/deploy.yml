name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /var/www/cocomarshmallow
            git pull origin main
            docker run --rm -v "$PWD":/app -w /app composer:2 install --no-dev --optimize-autoloader --no-interaction
            docker compose build --pull
            docker compose up -d
            # Caddy bind-mounts the Caddyfile as a single file. git pull
            # replaces it via write-then-rename, which changes its inode, so
            # the bind mount keeps pointing at the old deleted file and edits
            # never take effect until the container is recreated.
            docker compose up -d --force-recreate caddy
            docker image prune -f
            docker builder prune -af
